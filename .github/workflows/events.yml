# Events: keep the generated event pages, lists and calendar files in sync with
# events/events.json, and apply the event commands that the Power Automate flows
# email to the "[event-inbox]" issue.
#
# The site itself is still published by GitHub Pages "Deploy from a branch"
# (main, root) and by pda-tue.nl pulling the repo: this workflow only commits
# the generated files back to main.
name: Events

on:
  push:
    branches: [main]
    paths:
      - "events/events.json"
      - "tools/site/**"
  issues:
    types: [opened]
  # The Power Automate flows email event commands to the "event inbox" issue
  # through GitHub's reply-by-email; they arrive as comments by pda-board.
  issue_comment:
    types: [created]
  schedule:
    # Daily, so events move from "Upcoming" to "Past" after they happen.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build event pages
    if: contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.actor != 'github-actions[bot]'
    concurrency:
      group: events-build
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python3 tools/site/build.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html events cal
          if git diff --cached --quiet; then
            echo "Generated files are up to date."
            exit 0
          fi
          git commit -m "Rebuild event pages from events.json"
          git push origin HEAD:main && exit 0
          # main moved: start again from it (the inbox job may have pushed meanwhile)
          git fetch origin main && git reset --hard origin/main
          python3 tools/site/build.py
          git add -A index.html events cal
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild event pages from events.json"
          git push origin HEAD:main

  inbox-ready:
    name: Open the event inbox
    if: >-
      github.event_name == 'issues' && github.event.action == 'opened' &&
      github.event.issue.user.login == 'pda-board' &&
      startsWith(github.event.issue.title, '[event-inbox]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Say hello (sends pda-board the notification email whose reply address the flows use)
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body \
            "Event inbox ready. The Power Automate flows email new events and changes here; each one becomes a comment and is applied to the website automatically. Do not close or lock this issue."

  inbox:
    name: Apply an emailed event command
    if: >-
      github.event_name == 'issue_comment' &&
      startsWith(github.event.issue.title, '[event-inbox]') &&
      github.event.issue.user.login == 'pda-board' &&
      github.event.comment.user.login == 'pda-board' &&
      contains(github.event.comment.body, 'PDA-EVENT-BEGIN')
    # No concurrency group: GitHub would silently cancel a third queued run. Runs that
    # collide retry on top of the latest main instead (see the push loop).
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      ISSUE_BODY: ${{ github.event.comment.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply the command to events.json
        id: ingest
        continue-on-error: true
        run: python3 tools/site/ingest_issue.py --github-output "$GITHUB_OUTPUT" --error-file "$RUNNER_TEMP/error.txt"
      - name: Report the error
        if: steps.ingest.outcome == 'failure'
        run: |
          {
            echo "Could not apply this change:"
            echo
            echo '```'
            cat "$RUNNER_TEMP/error.txt" 2>/dev/null || echo "Unexpected error, see the workflow log."
            echo '```'
            echo
            echo "Nothing was changed on the website. Fill in the form again."
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          exit 1
      - name: Build, commit and push
        if: steps.ingest.outcome == 'success'
        env:
          EVENT_ID: ${{ steps.ingest.outputs.id }}
          ACTION: ${{ steps.ingest.outputs.action }}
        run: |
          python3 tools/site/build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html events cal
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Event ${ACTION}: ${EVENT_ID} (emailed)"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            # Someone else pushed first: apply the same command again on top of the new main.
            sleep $((i * 3))
            git fetch origin main && git reset --hard origin/main
            python3 tools/site/ingest_issue.py
            python3 tools/site/build.py
            git add -A index.html events cal
            git diff --cached --quiet && exit 0
            git commit -m "Event ${ACTION}: ${EVENT_ID} (emailed)"
          done
          exit 1
      - name: Mark the comment as done
        if: steps.ingest.outcome == 'success'
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content='+1' >/dev/null
      - name: Tell the board something went wrong
        if: (failure() || cancelled()) && steps.ingest.outcome == 'success'
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "The change was understood but could not be published (see the Actions tab). Ask the website maintainer."
